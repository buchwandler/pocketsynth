[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsynth"
dynamic = ["version"]
description = "UtterPlan-aware Python synthesis runtime for Pocket TTS ONNX bundles"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Pocketsynth contributors"}]
dependencies = [
  "numpy>=1.23",
  "utterplan>=0.2.0,<0.3",
  "sentencepiece>=0.2,<0.3",
  "onnxvoice>=0.1.11,<0.2",
  "audiocompose>=0.1,<0.2",
]
keywords = ["tts", "text-to-speech", "pocket-tts", "onnx", "speech", "onnxruntime"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
cpu = ["onnxvoice[cpu,pocket]>=0.1.11,<0.3"]
gpu = ["onnxvoice[gpu,pocket]>=0.1.11,<0.3"]
playback = ["sounddevice>=0.5,<0.6"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "mypy>=1.11",
  "build>=1",
]

[project.scripts]
pocketsynth = "pocketsynth.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pocketsynth*"]

[tool.setuptools.package-data]
pocketsynth = ["py.typed"]

[tool.setuptools_scm]
write_to = "pocketsynth/_version.py"
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "integration: tests requiring optional runtimes or external bundle assets",
  "network: tests requiring network access",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["pocketsynth"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

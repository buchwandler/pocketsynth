    observed_behavior:
      Made PocketRuntime.synthesize() a strict SynthesisRequest API
      that validates the whole request and performs at most one inference; moved chunked
      text rendering into explicit convenience functions, with sentence splitting disabled
      by default. Added typed request errors, static voice-level configuration, and
      voice identity/revision metadata.
    public_impact: public
    decision: accepted
    stale: false

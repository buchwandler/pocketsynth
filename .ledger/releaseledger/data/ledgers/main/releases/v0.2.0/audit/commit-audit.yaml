    observed_behavior:
      Removed the UtterPlan-driven PocketPipeline/document rendering
      and AudioCompose composition surface. PocketRuntime became the direct engine for
      prepared speakable text; convenience rendering returns request-local results.
      Removed UtterPlan, AudioCompose, and SSMD runtime dependencies, and aligned OnnxVoice
      extras to the Pocket-supported version range.
    public_impact: public

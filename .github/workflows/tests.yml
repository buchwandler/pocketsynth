name: Run tests
on:
  push:
  workflow_call:
  pull_request:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install packages
      run: |
        pip install pytest ruff mypy
        pip install -e ".[cpu,dev]"
        python -m compileall -q pocketsynth tests
    - name: Type-check package
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: python -m mypy --config-file pyproject.toml pocketsynth
    - name: Tests
      run: pytest
  python314-public-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install package and test dependencies
      run: |
        python -m pip install pytest
        python -m pip install -e .
    - name: Test no-model public API on Python 3.14
      run: >-
        python -m pytest -q
        tests/test_request_api_contract.py
        tests/test_package_boundary.py
        tests/test_discovery.py
  installed-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install build tooling
      run: python -m pip install build
    - name: Build wheel
      run: python -m build --wheel
    - name: Install wheel into a clean virtual environment
      run: |
        python -m venv /tmp/pocketsynth-wheel
        /tmp/pocketsynth-wheel/bin/python -m pip install dist/*.whl
    - name: Smoke-test installed public API without model assets
      run: |
        cd /tmp
        /tmp/pocketsynth-wheel/bin/python -I "$GITHUB_WORKSPACE/tests/wheel_api_smoke.py"
  onnxvoice-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        onnxvoice-version: ["0.2.2"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install packages with pinned OnnxVoice
      run: python -m pip install -e ".[dev]" "onnxvoice[cpu,pocket]==${{ matrix.onnxvoice-version }}"
    - name: Test OnnxVoice compatibility
      run: >-
        python -m pytest -q
        tests/test_onnxvoice_boundary.py
        tests/test_package_boundary.py
        tests/test_runtime_synthesis.py
        tests/test_voice.py

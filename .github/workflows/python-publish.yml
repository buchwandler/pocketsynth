# Build and publish a Python package when a GitHub Release is published.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build package
        run: |
          rm -rf dist
          python -m build
      - name: Check built distributions
        run: python -m twine check dist/*
      - name: Validate release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tarfile
          import zipfile
          from email import policy
          from email.parser import Parser
          from pathlib import Path
          from packaging.requirements import Requirement
          from packaging.version import Version

          def has_minimum(requirements, name, minimum):
              minimum_version = Version(minimum)
              return any(
                  requirement.name.lower() == name.lower()
                  and any(
                      spec.operator in (">=", ">", "==")
                      and Version(spec.version) >= minimum_version
                      for spec in requirement.specifier
                  )
                  for requirement in requirements
              )

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          artifacts = list(Path("dist").iterdir())
          wheels = [path for path in artifacts if path.suffix == ".whl"]
          sdists = [path for path in artifacts if path.name.endswith(".tar.gz")]
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          wheel_version = re.match(r"pocketsynth-([^-]+)-", wheels[0].name).group(1)
          sdist_version = re.match(r"pocketsynth-([^-]+)\.tar\.gz$", sdists[0].name).group(1)
          assert wheel_version == tag_version, (wheel_version, tag_version)
          assert sdist_version == tag_version, (sdist_version, tag_version)

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_metadata_name = next(
                  name for name in archive.namelist() if name.endswith("METADATA")
              )
              wheel_metadata_text = archive.read(wheel_metadata_name).decode("utf-8")
              assert any(name.endswith("pocketsynth/py.typed") for name in archive.namelist())

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_metadata_name = next(
                  name for name in archive.getnames() if name.endswith("PKG-INFO")
              )
              sdist_metadata_file = archive.extractfile(sdist_metadata_name)
              assert sdist_metadata_file is not None
              sdist_metadata_text = sdist_metadata_file.read().decode("utf-8")

          for raw_metadata in (wheel_metadata_text, sdist_metadata_text):
              metadata = Parser(policy=policy.default).parsestr(raw_metadata)
              requirements = [
                  Requirement(value) for value in metadata.get_all("Requires-Dist", [])
              ]
              dependency_names = {requirement.name.lower() for requirement in requirements}
              assert not dependency_names.intersection({"utterplan", "audiocompose", "ssmd"})
              assert has_minimum(requirements, "numpy", "1.23")
              onnxvoice_requirements = [
                  requirement
                  for requirement in requirements
                  if requirement.name.lower() == "onnxvoice"
              ]
              assert onnxvoice_requirements
              assert all(
                  has_minimum([requirement], "onnxvoice", "0.1.12")
                  for requirement in onnxvoice_requirements
              )
              assert all(
                  any(
                      spec.operator == "<" and Version(spec.version) <= Version("0.2")
                      for spec in requirement.specifier
                  )
                  for requirement in onnxvoice_requirements
              )
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
